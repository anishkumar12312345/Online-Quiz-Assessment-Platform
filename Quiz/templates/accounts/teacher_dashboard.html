<!DOCTYPE html>
<html>
<head>
    <title>Teacher Dashboard</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Poppins, Arial;
            background: linear-gradient(to right, #7F7FD5, #86A8E7, #91EAE4);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .dashboard {
            background: white;
            width: 450px;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            text-align: center;
        }
        h2 {
            margin-bottom: 10px;
            color: #333;
        }
        p {
            color: #555;
        }
        .btn {
            display: block;
            width: 100%;
            margin-top: 15px;
            padding: 14px;
            font-size: 16px;
            background: #6f86d6;
            color: white;
            border: none;
            border-radius: 8px;
            text-decoration: none;
            cursor: pointer;
        }
        .btn:hover {
            background: #5b6cc4;
        }
        .logout-btn {
            background: #ff6b6b;
        }
        .logout-btn:hover {
            background: #e55656;
        }
    </style>
</head>

<body>

<div class="dashboard">
    <h2>Teacher Dashboard</h2>
    <p>Manage your quizzes and track student performance</p>

    <a href="{% url 'create_quiz' %}" class="btn">Create New Quiz</a>
    <a href="{% url 'view_quizzes' %}" class="btn">View Previous Quizzes</a>
    <a href="{% url 'logout' %}" class="btn logout-btn">Logout</a>
</div>

</body>
</html>
