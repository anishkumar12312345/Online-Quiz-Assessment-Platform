<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register - Online Assessment Platform</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap');

        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Floating neon circles */
        .circle {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.6;
            animation: float 10s infinite ease-in-out alternate;
        }

        .circle:nth-child(1) {
            width: 350px; height: 350px;
            background: #ff6bcb;
            top: -80px; left: -60px;
        }

        .circle:nth-child(2) {
            width: 300px; height: 300px;
            background: #7efff5;
            bottom: -50px; right: -50px;
            animation-delay: 2s;
        }

        @keyframes float {
            from { transform: translateY(0px); }
            to   { transform: translateY(40px); }
        }

        .container {
            width: 420px;
            background: rgba(255,255,255,0.18);
            backdrop-filter: blur(18px);
            border-radius: 20px;
            padding: 40px 35px;
            z-index: 10;
            text-align: center;
            box-shadow: 0 10px 35px rgba(0,0,0,0.25);
            animation: fadeIn 1s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(40px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .title {
            font-size: 28px;
            font-weight: 800;
            color: white;
            text-shadow: 0 3px 12px rgba(0,0,0,0.4);
            margin-bottom: 30px;
            line-height: 1.3;
            padding: 0 10px;
        }

        h2 {
            color: white;
            font-weight: 700;
            margin-bottom: 20px;
            font-size: 22px;
        }

        .input-box {
            width: 100%;
            padding: 12px;
            margin-top: 12px;
            border-radius: 10px;
            border: none;
            background: rgba(255,255,255,0.25);
            font-size: 15px;
            color: white;
            outline: none;
            box-shadow: 0 0 10px rgba(255,255,255,0.2) inset;
        }

        .input-box::placeholder {
            color: #f1f1f1;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            background: linear-gradient(135deg, #fa709a, #fee140);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0,0,0,0.25);
            transition: 0.3s ease;
        }

        button:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.35);
        }

        a {
            color: #ffffff;
            text-decoration: underline;
            font-weight: 500;
        }

    </style>
</head>

<body>

    <!-- Neon floating circles -->
    <div class="circle"></div>
    <div class="circle"></div>

    <div class="container">

        <!-- Project Title -->
        <div class="title">
            ONLINE EDUCATIONAL <br>
            ASSESSMENT PLATFORM
        </div>

        <h2>Create Account</h2>

        <form method="POST"  autocomplete="off"
>
            {% csrf_token %}

            <input class="input-box" type="text" name="username" placeholder="Choose Username" required autocomplete="off"
>

            <input class="input-box" type="email" name="email" placeholder="Enter Email" required autocomplete="off"
>

            <input class="input-box" type="password" name="password" placeholder="Password" required autocomplete="off"
>

            <input class="input-box" type="password" name="confirm_password" placeholder="Confirm Password" required autocomplete="off"
>

            <button type="submit">Register</button>
        </form>

        <p style="margin-top: 15px; color: white;">
            Already have an account?
            <a href="{% url 'login' %}">Login here</a>
        </p>

        {% if messages %}
            {% for m in messages %}
                <p style="color: yellow; margin-top: 15px;">{{ m }}</p>
            {% endfor %}
        {% endif %}
    </div>

</body>
</html>
