<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Quiz Results PDF</title>

    <style>
        body {
            font-family: DejaVu Sans, sans-serif;
            margin: 20px;
            font-size: 14px;
        }

        h2 {
            text-align: center;
            margin-bottom: 5px;
        }

        h3 {
            text-align: center;
            margin-top: 0;
            color: #444;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 25px;
        }

        table, th, td {
            border: 1px solid #444;
        }

        th {
            background: #efefef;
            padding: 8px;
            text-align: center;
            font-weight: bold;
        }

        td {
            padding: 6px;
            text-align: center;
        }

        .footer {
            margin-top: 30px;
            text-align: center;
            font-size: 12px;
            color: #777;
        }
    </style>
</head>

<body>

<h2>Results for Quiz: {{ quiz.title }}</h2>
<h3>Quiz Code: {{ quiz.code }}</h3>

<table>
    <tr>
        <th>Student</th>
        <th>Score</th>
        <th>Total</th>
        <th>Submitted At</th>
    </tr>

    {% for r in results %}
    <tr>
        <td>{{ r.student.username }}</td>
        <td>{{ r.score }}</td>
        <td>{{ r.total }}</td>
        <td>{{ r.submitted_at }}</td>
    </tr>
    {% endfor %}
</table>

<p class="footer">
    Generated by Online Quiz System | {{ quiz.title }}
</p>

</body>
</html>
