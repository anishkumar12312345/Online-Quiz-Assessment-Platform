<!DOCTYPE html>
<html>
<head>
    <title>Student Dashboard</title>

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #89f7fe, #66a6ff);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .container {
            width: 85%;
            max-width: 900px;
            padding: 40px;
            background: rgba(255,255,255,0.18);
            backdrop-filter: blur(12px);
            border-radius: 25px;
            box-shadow: 0px 6px 25px rgba(0,0,0,0.2);
            animation: fadeIn 0.8s ease-out;
            text-align: center;
            color: #fff;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-size: 38px;
            margin-bottom: 25px;
            font-weight: bold;
        }

        .btn-box {
            display: flex;
            justify-content: space-evenly;
            margin-top: 40px;
        }

        .card {
            width: 42%;
            padding: 25px;
            border-radius: 15px;
            cursor: pointer;
            transition: 0.3s ease;
            text-decoration: none;
            font-size: 18px;
            font-weight: 600;
            box-shadow: 0px 4px 18px rgba(0,0,0,0.25);
            color: white;
            text-align: center;
        }

        /* Attempt Quiz button */
        .card.attempt {
            background: linear-gradient(135deg, #ff9966, #ff5e62);
        }

        /* Attempted quizzes button */
        .card.history {
            background: linear-gradient(135deg, #6a11cb, #2575fc);
        }

        /* LOGOUT BUTTON */
        .logout-btn {
            margin-top: 35px;
            display: inline-block;
            padding: 14px 35px;
            background: linear-gradient(135deg, #ff5858, #f857a6);
            color: white;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.25);
            transition: 0.3s ease;
        }

        .logout-btn:hover {
            transform: translateY(-8px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }
    </style>
</head>

<body>

<div class="container">
    <h1>Welcome, {{ request.user.username }} 👋</h1>

    <div class="btn-box">

        <a href="{% url 'enter_quiz_code' %}" class="card attempt">
            🎯 Attempt Quiz
        </a>

        <a href="{% url 'view_attempted_quizzes' %}" class="card history">
            📘 My Attempted Quizzes
        </a>

    </div>

    <!-- LOGOUT BUTTON -->
    <a href="{% url 'logout' %}" class="logout-btn">
        🚪 Logout
    </a>

</div>

</body>
</html>
