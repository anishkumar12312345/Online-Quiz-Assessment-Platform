<!DOCTYPE html>
<html>
<head>
    <title>Select Role</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #6f86d6, #48c6ef);
            font-family: 'Poppins', sans-serif;
        }

        .box {
            width: 400px;
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0px 10px 25px rgba(0,0,0,0.2);
        }

        h2 {
            margin-bottom: 20px;
        }

        button {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border-radius: 10px;
            background: #6f86d6;
            border: none;
            font-size: 18px;
            color: white;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #5363c9;
        }
    </style>
</head>
<body>

<div class="box">
    <h2>Are you a Teacher or a Student?</h2>

    <form method="POST">
        {% csrf_token %}
        <button name="role" value="teacher">Teacher</button>
        <button name="role" value="student">Student</button>
    </form>
</div>

</body>
</html>
