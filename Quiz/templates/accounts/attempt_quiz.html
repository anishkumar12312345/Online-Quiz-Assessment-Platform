<!DOCTYPE html>
<html>
<head>
    <title>Attempt Quiz</title>
    <style>
        body {
            font-family: Poppins;
            background: #f0f8ff;
            padding: 30px;
        }
        .question-box {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            box-shadow: 0px 3px 12px rgba(0,0,0,0.1);
        }
        .timer {
            font-size: 24px;
            font-weight: bold;
            color: red;
            position: fixed;
            top: 20px;
            right: 30px;
        }
        button {
            background: #6f86d6;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
        }
    </style>

    <script>
        let timeLeft = {{ time_limit }};   // seconds
        function startTimer() {
            let timer = setInterval(function() {
                let minutes = Math.floor(timeLeft / 60);
                let seconds = timeLeft % 60;

                document.getElementById("timer").textContent =
                    minutes + "m " + seconds + "s";

                if (timeLeft <= 0) {
                    clearInterval(timer);
                    document.getElementById("quizForm").submit();
                }
                timeLeft--;
            }, 1000);
        }
        window.onload = startTimer;
    </script>
</head>

<body>

<div class="timer" id="timer"></div>

<h2>{{ quiz.title }}</h2>

<form method="POST" id="quizForm">
    {% csrf_token %}

    {% for q in questions %}
    <div class="question-box">
        <p><b>Q{{ forloop.counter }}. {{ q.question_text }}</b></p>

        <label><input type="radio" name="{{ q.id }}" value="A"> {{ q.option_a }}</label><br>
        <label><input type="radio" name="{{ q.id }}" value="B"> {{ q.option_b }}</label><br>
        <label><input type="radio" name="{{ q.id }}" value="C"> {{ q.option_c }}</label><br>
        <label><input type="radio" name="{{ q.id }}" value="D"> {{ q.option_d }}</label><br>
    </div>
    {% endfor %}

    <button type="submit">Submit Quiz</button>
</form>

</body>
</html>
